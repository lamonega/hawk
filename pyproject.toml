[project]
name = "hawk"
version = "0.9.0"
description = "AI-powered LinkedIn Easy Apply job applier using MCP"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp>=2.0.0",
    "playwright>=1.45.0",
    "playwright-stealth>=2.0.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.0",
    "click>=8.1.0",
    "loguru>=0.7.0",
    "httpx>=0.27.0",
    "pypdf>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
hawk = "hawk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
