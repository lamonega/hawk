# hawk user profile — Fill this in so hawk can answer LinkedIn form questions automatically.
# hawk will use this data to pre-fill Easy Apply forms. When a question doesn't match
# any profile field, hawk will ask you in chat and save the answer for next time.
#
# IMPORTANT: If 'completed_at' is empty, the profile is considered INCOMPLETE.
# The agent will ask you to fill it before applying to any jobs.

# Set automatically when the profile is completed (YYYY-MM-DDTHH:MM:SS)
completed_at: ""

personal:
  first_name: ""
  last_name: ""
  email: ""
  phone: ""
  city: ""
  state: ""
  country: ""
  postal_code: ""

# Links (optional)
links:
  linkedin: ""
  github: ""
  portfolio: ""
  website: ""

# Professional summary
professional:
  headline: ""
  summary: ""
  years_of_experience: ""
  current_title: ""
  current_company: ""

# Work authorization (common LinkedIn question)
work_authorization:
  authorized: true
  sponsorship_required: false
  country: ""
  work_status: ""  # e.g. "US Citizen", "Green Card", "H1B", "OPT", "None"

# Education
education:
  degree: ""        # e.g. "Bachelor's", "Master's", "PhD"
  field: ""         # e.g. "Computer Science"
  school: ""        # e.g. "MIT"
  graduation_year: ""

# Skills — map skill name to proficiency level (1-5)
skills:
  # python: 4
  # javascript: 3
  # react: 3

# Experience — list of previous roles
experience:
  # - title: "Software Engineer"
  #   company: "Google"
  #   duration: "2 years"
  #   description: "Built microservices..."

# Salary expectations
salary:
  current: ""
  expected: ""
  currency: "USD"
  negotiable: true

# Languages — map language to proficiency
languages:
  # english: "Fluent"
  # spanish: "Native"

# Preferences for job search
preferences:
  remote_only: true
  min_salary: ""
  notice_period: "2 weeks"
  start_date: "Immediately"

# Common answers — cache for recurring LinkedIn questions
# hawk will save answers here after you answer them in chat.
# Format: question_pattern -> answer
common_answers:
  # "years of experience": "3"
  # "willing to relocate": "No"
  # "start date": "Immediately"
